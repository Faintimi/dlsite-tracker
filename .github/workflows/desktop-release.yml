# 桌面版打包（Windows NSIS + macOS .app）：产出安装包 / 应用包，供下载与验收测试。
# 触发：手动触发 / 推送 desktop/** 到 main（仅上传产物）/ 推送 desktop-v* 标签（同时附加到 Release）。
name: Desktop Build (Windows / macOS)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["desktop-v*"]
    paths:
      - "desktop/**"
      - "dlsite_tracker/**"
      - "packaging/**"
      - "scripts/build-sidecar.sh"
      - ".github/workflows/desktop-release.yml"

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build embedded pipeline (sidecar)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: bash scripts/build-sidecar.sh

      - name: Build installer (NSIS)
        run: npm run tauri build -- --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: doujin-game-radar-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build embedded pipeline (sidecar)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: bash scripts/build-sidecar.sh

      - name: Build app bundle
        run: npm run tauri build -- --bundles app

      - name: Package zip
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --keepParent "Doujin Game Radar.app" "../DoujinGameRadar-macos.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: doujin-game-radar-macos-app
          path: desktop/src-tauri/target/release/bundle/DoujinGameRadar-macos.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-artifacts

      - name: Attach packages to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-artifacts/doujin-game-radar-windows-installer/*.exe
            dist-artifacts/doujin-game-radar-macos-app/*.zip
          name: "Doujin Game Radar ${{ github.ref_name }}"
          body: |
            同人游戏雷达 · Doujin Game Radar —— 桌面版（Windows 安装包 / macOS 应用包）。

            - Windows：NSIS `.exe` 安装包（Windows 10+，WebView2 由安装器处理）
            - macOS：`.app` 压缩包，解压后拖入「应用程序」即可（未签名，首次打开如被拦截请右键→打开）
            - 「更新数据」功能需要本机安装 Python 3.9+ 并准备好数据管道（见仓库 README）
            - Windows installer (NSIS) and macOS `.app` bundle for the local-first
              DLsite doujin game browser. Python 3.9+ is required for the in-app
              update feature.
