; ============================================================
; dlsite-tracker 配置模板
; 用法：cp config.example.ini config.ini 后按需修改
; config.ini 已被 .gitignore 忽略，不会进入 git 提交
; ============================================================

[general]
; 数据目录（SQLite、封面图等）与输出目录；相对本仓库根目录
data_dir = data
out_dir = out
; DLsite 使用日本时间（JST），用于日期切分与日志
timezone = Asia/Tokyo

[scope]
; 采集分区（可扩展为多分区），逗号分隔；默认 maniax（同人·R18 男性向）
; 参考：girls（乙女向）、bl（BL 向）、pro（商业美少女）、garumani
sites = maniax
; 导出与本地 API 的默认作品形式过滤（游戏白名单；留空 = 不过滤）
; 游戏类型实测枚举：RPG 角色扮演 / SLN 模拟 / ADV 冒险 / ACN 动作 / STG 射击
;   PZL 拼图 / QIZ 问答 / TBL 桌游 / DNV 电子小说 / ETC 其他游戏 / TYP 打字
; 非游戏（不入库）：MNG 漫画 / ICG CG插画 / MOV 视频 / SOU 音声 / MUS 音乐 / NRE 小说 / AMT / IMT / TOL / VCM
default_work_types = RPG, SLN, ADV, ACN, STG, PZL, QIZ, TBL, DNV, ETC, TYP

[http]
; 礼貌节流：robots.txt 规定 Crawl-delay: 10 —— 请勿调低
page_delay_seconds = 10.0
; 站点自有 JSON 接口间隔（硬下限 1.0；1.0 已经维护者评审批准，属最激进可接受值）
api_delay_seconds = 1.0
; 封面缩略图下载间隔（0.25 × workers=4 ≈ 16 张/秒；2026-09-22 经维护者批准；硬下限 0.2）
image_delay_seconds = 0.25
timeout_seconds = 25
max_retries = 4
; UA 不含任何个人信息
user_agent = dlsite-tracker/0.1 (local personal data pipeline)

[discovery]
; 增量发现：每日 sitemap 从最新分片向前扫描，命中已见作品号即停止
sitemap_max_shards_per_run = 3
; 榜单视图：term × category（每视图 100 条，含销量）
rank_terms = day, week, month
rank_categories = game
; 分类人气列表（P19，替代原「分类榜」——后者经复核为重复数据）：
;   每个分类按人气序取前 N×100 件（100 件/页，≥10s/页），名次/销量入库
;   genre_rank_ids：逗号分隔的分类 id（起步 15 个游戏向分类，见 README）
;   genre_rank_pages：每个分类抓取的页数（1 页 = 100 件）
genre_rank_ids = 016,502,048,510,526,317,046,004,536,432,533,509,519,431,012
genre_rank_pages = 2
; 每日自动刷新抓取页数（P20 做减法：默认 1 页 = 维持各分类前 100 新鲜；
;   现导入 / 载入更多 / 手动 rankings 不受此限（用 genre_rank_pages））
genre_daily_pages = 1
; 全站人气序（P19.4/P20）：官方「人気順」目录每天抓取的页数（5 页 = 前 500 名；0 = 关闭）
;   名次写入 rank_trend_current，供应用「人气（官方）」排序与 #名次 显示
trend_pages = 5
; 列表页（robots 仅允许第 1 页）
list_work_types = game

[enrich]
; 富化 = 通过 product.json 补齐字段；每次运行最多处理的作品数
batch_size_per_run = 400
; 热榜窗口（天）：热榜模式下仅富化近 N 天出现在榜单/列表中的作品
hot_window_days = 7
; 语言：product.json 的 locale 参数（zh_CN = 官方简体中文分类/作品形式；可选 en_US、zh_TW 等）
locale = zh_CN
; 是否在数据库中保留原始 JSON（体积较大）
store_raw = false

[import]
; 渐进导入（import-recent）：把「最近 N 年」的作品批量富化入库（断点续传）
; 每日调度会先看有无进行中的任务（有则自动续传）
; 0 = 关闭（默认）；1 = 最近一年；3 = 最近三年
; 也可手动运行：python3 -m dlsite_tracker import-recent --years 1
; 范围按「作品编号校准边界」界定，不受价格更新干扰
years = 0
; —— 质量门槛（两项都 >0 才启用；任一为 0 = 关闭过滤）——
; 最近 fresh_days 天内发售的新作一律收录；
; 更早的作品先经 info/ajax 批量实查销量（40 件/请求），仅 dl_count ≥ min_sales 的富化
fresh_days = 90
min_sales = 2000
; 封面自愈（P12.1）：导入中每累计富化 N 件顺带补一批封面（0 = 关闭）
cover_trigger = 1000
; 每批最多下载张数（导入中触发与导入结束收尾各用一次）
cover_batch = 300

[images]
; 是否下载封面缩略图到 out/covers/（随导出交付给应用；缺失时应用显示占位图）
enabled = true
; 每次运行最多下载张数
max_per_run = 300
; 下载并发：每个 worker 独立节流与 keep-alive 连接；4 × 0.25s ≈ 16 张/秒（P14，2026-09-22 批准）
workers = 4

[serve]
; 本地只读 API（仅监听回环地址，勿改为 0.0.0.0）
host = 127.0.0.1
port = 8765
