; ============================================================
; 同人游戏雷达 · Doujin Game Radar — 配置模板 / Configuration template
; 用法 / Usage：cp config.example.ini config.ini 后按需修改（edit as needed）
; config.ini 已被 .gitignore 忽略，不会进入 git 提交
; config.ini is git-ignored and never committed
; ============================================================

[general]
; 数据目录（SQLite、封面图等）与输出目录；相对本仓库根目录
; Data & output directories (SQLite, covers, ...); relative to the repo root
data_dir = data
out_dir = out
; DLsite 使用日本时间（JST），用于日期切分与日志
; DLsite uses Japan time (JST) for date bucketing and logs
timezone = Asia/Tokyo

[scope]
; 采集分区（可扩展为多分区），逗号分隔；默认 maniax（同人·R18 男性向）
; Crawl sites (comma-separated, extensible); default maniax (doujin, R18, male-oriented)
; 参考：girls（乙女向）、bl（BL 向）、pro（商业美少女）、garumani / Others: girls / bl / pro / garumani
sites = maniax
; 导出与本地 API 的默认作品形式过滤（游戏白名单；留空 = 不过滤）
; Default work-type filter for export & local API (game whitelist; empty = no filter)
; 游戏类型实测枚举：RPG 角色扮演 / SLN 模拟 / ADV 冒险 / ACN 动作 / STG 射击
; Observed game types: RPG / SLN / ADV / ACN / STG / PZL / QIZ / TBL / DNV / ETC / TYP
;   PZL 拼图 / QIZ 问答 / TBL 桌游 / DNV 电子小说 / ETC 其他游戏 / TYP 打字
; 非游戏（不入库）：MNG 漫画 / ICG CG插画 / MOV 视频 / SOU 音声 / MUS 音乐 / NRE 小说 / AMT / IMT / TOL / VCM
; Non-games (never imported): MNG / ICG / MOV / SOU / MUS / NRE / AMT / IMT / TOL / VCM
default_work_types = RPG, SLN, ADV, ACN, STG, PZL, QIZ, TBL, DNV, ETC, TYP

[http]
; 礼貌节流：robots.txt 规定 Crawl-delay: 10 —— 请勿调低
; Polite throttling: robots.txt mandates Crawl-delay: 10 — do NOT lower
page_delay_seconds = 10.0
; 站点自有 JSON 接口间隔（硬下限 1.0；1.0 已经维护者评审批准，属最激进可接受值）
; Interval for the site's own JSON APIs (hard floor 1.0; approved as the most aggressive acceptable value)
api_delay_seconds = 1.0
; 封面缩略图下载间隔（0.25 × workers=4 ≈ 16 张/秒；硬下限 0.2）
; Cover thumbnail interval (0.25 × workers=4 ≈ 16/s; hard floor 0.2)
image_delay_seconds = 0.25
timeout_seconds = 25
max_retries = 4
; UA 不含任何个人信息 / User agent contains no personal information
user_agent = dlsite-tracker/0.1 (local personal data pipeline)

[discovery]
; 增量发现：每日 sitemap 从最新分片向前扫描，命中已见作品号即停止
; Incremental discovery: scan sitemap shards newest-first, stop at a known work number
sitemap_max_shards_per_run = 3
; 榜单视图：term × category（每视图 100 条，含销量）
; Ranking views: term × category (100 entries per view, with sales counts)
rank_terms = day, week, month
rank_categories = game
; 分类人气列表：每个分类按人气序取前 N×100 件（100 件/页，≥10s/页），名次/销量入库
; Genre popularity lists: top N×100 per genre by popularity order; ranks & sales recorded
;   genre_rank_ids：逗号分隔的分类 id / comma-separated genre ids
;   genre_rank_pages：每个分类抓取的页数（1 页 = 100 件）/ pages per genre (1 page = 100 works)
genre_rank_ids = 016,502,048,510,526,317,046,004,536,432,533,509,519,431,012
genre_rank_pages = 2
; 每日自动刷新抓取页数（默认 1 页 = 维持各分类前 100 新鲜；0 = 关闭）
; Daily refresh pages per genre (default 1 = keep top-100 fresh; 0 = off)
genre_daily_pages = 1
; 全站人气序：官方「人気順」目录每天抓取的页数（5 页 = 前 500 名；0 = 关闭）
; Official popularity order pages per day (5 = top 500; 0 = off)
trend_pages = 5
; 列表页（robots 仅允许第 1 页）
; Listing pages (robots allows page 1 only)
list_work_types = game

[enrich]
; 富化 = 通过 product.json 补齐字段；每次运行最多处理的作品数
; Enrichment via product.json; max works processed per run
batch_size_per_run = 400
; 热榜窗口（天）：热榜模式下仅富化近 N 天出现在榜单/列表中的作品
; Hot window (days): in hot mode, only enrich works seen on rankings/lists within N days
hot_window_days = 7
; 语言：product.json 的 locale 参数（zh_CN = 官方简体中文；可选 en_US、zh_TW 等）
; Locale for product.json (zh_CN = official Simplified Chinese; en_US / zh_TW also available)
locale = zh_CN
; 是否在数据库中保留原始 JSON（体积较大）
; Keep raw JSON in the database (large)
store_raw = false

[import]
; 渐进导入（import-recent）：把「最近 N 年」的作品批量富化入库（断点续传）
; Progressive import: batch-import works from the last N years (resumable)
; 0 = 关闭（默认）；1 = 最近一年；3 = 最近三年；每日调度会自动续传进行中的任务
; 0 = off (default); 1 / 3 = last one / three years; the daily job auto-resumes running tasks
; 也可手动运行 / manually: python3 -m dlsite_tracker import-recent --years 1
years = 0
; —— 质量门槛（两项都 >0 才启用；任一为 0 = 关闭过滤）——
; Quality gates (both must be > 0; either 0 disables filtering):
; 最近 fresh_days 天内发售的新作一律收录；更早的作品先批量实查销量，仅 ≥ min_sales 的富化
; New releases within fresh_days are always kept; older works are sales-checked first (min_sales)
fresh_days = 90
min_sales = 2000
; 封面自愈：导入中每累计富化 N 件顺带补一批封面（0 = 关闭）
; Cover self-healing: fetch a batch of covers every N enriched works (0 = off)
cover_trigger = 1000
; 每批最多下载张数（导入中触发与导入结束收尾各用一次）
; Max covers per batch (used during import and at the finishing pass)
cover_batch = 300

[images]
; 是否下载封面缩略图到 out/covers/（随导出交付给应用；缺失时应用显示占位图）
; Download cover thumbnails to out/covers/ (shipped with the export; app shows a placeholder if missing)
enabled = true
; 每次运行最多下载张数 / max covers per run
max_per_run = 300
; 下载并发：每个 worker 独立节流与 keep-alive；4 × 0.25s ≈ 16 张/秒
; Download workers: each with its own throttle & keep-alive; 4 × 0.25s ≈ 16/s
workers = 4

[serve]
; 本地只读 API（仅监听回环地址，勿改为 0.0.0.0）
; Local read-only API (loopback only — do not bind 0.0.0.0)
host = 127.0.0.1
port = 8765
